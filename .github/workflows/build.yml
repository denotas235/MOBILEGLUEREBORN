name: Build MobileGlues for iOS and Android

on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build MobileGlues
        run: |
          cd MobileGlues-cpp
          wget https://github.com/leetal/ios-cmake/raw/master/ios.toolchain.cmake
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake \
            -DSTATICLIB=OFF \
            -DMACOS=ON \
            -DPLATFORM=OS64 \
            -DCMAKE_C_FLAGS=-Wno-error=implicit-function-declaration
          cmake --build build --config RelWithDebInfo --target mobileglues
          codesign -s - build/libmobileglues.dylib

      - name: Upload lib
        uses: actions/upload-artifact@v4
        with:
          name: MobileGlues-iOS-dylib
          path: MobileGlues-cpp/build/libmobileglues.dylib

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Build MobileGlues for Android arm64-v8a (TECNO KH7)
        run: |
          cd MobileGlues-cpp
          cmake -B build_arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build_arm64 --config Release --target mobileglues

      - name: Build MobileGlues for Android armeabi-v7a
        run: |
          cd MobileGlues-cpp
          cmake -B build_arm32 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build_arm32 --config Release --target mobileglues

      - name: Upload arm64-v8a SO
        uses: actions/upload-artifact@v4
        with:
          name: libmobileglues-android-arm64
          path: MobileGlues-cpp/build_arm64/libmobileglues.so

      - name: Upload armeabi-v7a SO
        uses: actions/upload-artifact@v4
        with:
          name: libmobileglues-android-arm32
          path: MobileGlues-cpp/build_arm32/libmobileglues.so

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/feature/mali-g52-phase1'
        with:
          name: MobileGlues Mali-G52 Build
          tag_name: mali-g52-build-${{ github.run_number }}
          files: |
            MobileGlues-cpp/build_arm64/libmobileglues.so
            MobileGlues-cpp/build_arm32/libmobileglues.so
          fail_on_unmatched_files: false
