# =============================================================================
# MobileGlues Configuration - NVR APK (TECNO KH7 - Mali-G52 Optimized)
# =============================================================================
# Generated for Nexus Vulkan Render (NVR) pipeline
# Target: TECNO KH7 (Mali-G52 MC2, GLES 3.2, Vulkan 1.1.177)
# Launcher: Zalith
#
# NOTE: This file will be placed in assets/mobileglues.conf inside the APK
# =============================================================================

# --- ANGLE Settings ---
# 0 = DisableIfPossible, 1 = EnableIfPossible, 2 = ForceDisable, 3 = ForceEnable
# RECOMMENDATION: Disable ANGLE for Mali-G52 (native driver is well-optimized)
enableANGLE = 0

# --- Error Handling ---
# 0 = Auto, 1 = Disable, 2 = Level1 (Partial), 3 = Level2 (Full)
enableNoError = 0

# --- Extensions ---
# Enable compute shaders (Mali-G52 supports it)
enableExtComputeShader = 1
# Enable timer queries for profiling
enableExtTimerQuery = 1
# Enable direct state access (reduces redundant binds)
enableExtDirectStateAccess = 1

# --- MultiDraw Emulation ---
# 0 = Auto, 1 = PreferIndirect, 2 = PreferBaseVertex, 3 = PreferMultidrawIndirect,
# 4 = DrawElements, 5 = Compute
# RECOMMENDATION: PreferBaseVertex for Mali-G52 (best compatibility)
multidrawMode = 2

# --- ANGLE Depth Clear Fix ---
# 0 = Disabled, 1 = Mode1, 2 = Mode2
# Only relevant if ANGLE is enabled
angleDepthClearFixMode = 0

# --- Custom OpenGL Version ---
# 0 = Default (4.0), 32 = ES 3.2, 46 = 4.6
# RECOMMENDATION: Use 4.6 for better shader compatibility
customGLVersion = 46

# --- GLSL Cache ---
# Size in MB (0 = disabled)
# RECOMMENDATION: 64MB for Mali-G52 (good balance between performance and storage)
maxGlslCacheSize = 64

# --- FSR1 (AMD Upscaling) ---
# 0 = Disabled, 1 = UltraQuality, 2 = Quality, 3 = Balanced, 4 = Performance
# Disabled by default (not needed for mobile)
fsr1Setting = 0

# --- Hide MobileGlues Environment ---
# 0 = Disabled, 1 = Level1 (Hide extensions + randomize strings)
# Keep disabled for debugging
HideMGEnvLevel = 0

# =============================================================================
# GPU Optimizations - Mali-G52 Specific
# =============================================================================
[gpu_optimizations]

[gpu_optimizations.anisotropic_filtering]
# Mali-G52 supports up to 16x, but 8x is safer (4x caused color corruption)
enabled = true
max_level = 8
force_limit = true

[gpu_optimizations.framebuffer_invalidation]
# Disabled: caused invisible player and flickering issues
enabled = true
invalidate_depth = false
invalidate_stencil = false

[gpu_optimizations.extension_scanner]
# Scan for available OpenGL extensions
enabled = true
scan_system_libs = true
cache_result = true
cache_path = /sdcard/MG/extensions_cache.json

[gpu_optimizations.ubo_ssbo_conversion]
# Convert UBOs to SSBOs for better performance on Mali
enabled = true
max_ubo_size_kb = 64
auto_convert = true

[gpu_optimizations.shader_binary_cache]
# Cache compiled shaders to reduce load times
enabled = true
cache_path = /sdcard/MG/shader_binaries
use_arm_binary = true
use_arb_binary = false

[gpu_optimizations.damage_regions]
# Track dirty regions for partial rendering (experimental)
enabled = false
track_dirty_regions = true
max_regions = 16

[gpu_optimizations.framebuffer_fetch]
# ENABLED: Mali-G52 supports Framebuffer Fetch (critical for post-processing)
enabled = true
rewrite_shaders = true
detect_patterns = true
supported_ops = ["bloom", "dof", "motion_blur"]

[gpu_optimizations.astc_transcoding]
# Transcode ASTC textures to DXT1/BC7 (disabled by default)
enabled = false
async_thread_pool = 4
cache_transcoded = true
formats_to_transcode = ["DXT1", "BC7"]
quality = "balanced"

[gpu_optimizations.phase2_lighting]
# ENABLED: Phase 2 lighting optimization for Mali GPUs
enabled = true
